{% extends "base.html" %}

{% block content %}
<div class="container text-center" style="max-width: 1000px;">

  <h1 class="display-4 fw-bold text-success mb-3">{{ _('Wat wil je doen?') }}</h1>
  <p class="fs-3 text-success mb-5">{{ _('Kies hieronder waarmee je aan de slag wil.') }}</p>

  <div class="d-flex flex-wrap justify-content-center gap-4 mb-4">

    <a href="{{ url_for('student.start_exercises') }}" class="text-decoration-none text-center mode-card">
      <div class="bg-light rounded shadow p-4">
        <img src="{{ image_url('happy_animals.png') }}" alt="{{ _('Rekenoefeningen') }}" class="mode-card-img mb-3">
        <p class="fs-3 text-dark fw-bold mb-0">{{ _('Rekenoefeningen') }}</p>
      </div>
    </a>

    <a href="{{ url_for('student.motor_task_intro') }}" class="text-decoration-none text-center mode-card">
      <div class="bg-light rounded shadow p-4">
        <img src="{{ url_for('static', filename='motor_task/astronaut.png') }}" alt="{{ _('Reactiespel') }}" class="mode-card-img" style="object-fit: contain; background: #000;">
        <p class="fs-3 text-dark fw-bold mb-0 mt-3">{{ _('Reactiespel') }}</p>
      </div>
    </a>

  </div>

</div>

<style>
  .mode-card {
    width: 320px;
  }

  .mode-card-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 12px;
  }
</style>
{% endblock %}
