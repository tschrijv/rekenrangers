{% extends "base.html" %}

{% block content %}
<div class="container text-center" style="max-width: 900px;">

  <h1 class="display-3 fw-bold text-success mb-3">{{ _('Demo klaar') }}</h1>

  <div class="p-4 bg-light border rounded-4 shadow-sm" style="border-radius: 20px;">
    <p class="fs-3 text-success mb-4">
      {{ _('Bedankt! De demo is afgelopen.') }}
    </p>

    <!-- Big end button -->
    <form method="post" action="{{ url_for('student.demo_exit') }}" class="m-0">
      <button type="submit"
              class="btn btn-jungle btn-jungle-lg px-5 py-4 fw-bold"
              style="border-radius: 18px; font-size: 2rem;">
        {{ _('Ik ben er klaar voor!') }}
      </button>
    </form>
  </div>

</div>

{% include "_demo_overlay.html" %}
{% endblock %}
