{% extends "base.html" %}
{% block content %}
{% include "_demo_overlay.html" %}


<!-- Feedback audios -->
<audio id="audio-toprow-wrong" preload="auto" playsinline>
  <source src="{{ audio_url('2.1.2 Scherm met toetsenbord.mp3') }}" type="audio/mpeg">
</audio>

<audio id="audio-numpad-wrong" preload="auto" playsinline>
  <source src="{{ audio_url('2.1.1 Scherm met toetsenbord.mp3') }}" type="audio/mpeg">
</audio>

<audio id="audio-correct" preload="auto" playsinline>
  <source src="{{ audio_url('2.1.3 Scherm met toetsenbord.mp3') }}" type="audio/mpeg">
</audio>

<form id="demo-next-form" method="post" action="{{ url_for('student.demo_next') }}" class="d-none">
  <input type="hidden" name="numpad_result" id="numpad-result" value="">
  <input type="hidden" name="numpad_key" id="numpad-key" value="">
  <input type="hidden" name="numpad_source" id="numpad-source" value="">
</form>

<div class="d-flex justify-content-center mb-5">
  <div class="bg-light rounded shadow p-4 keyboard-demo-wrapper">

    <div class="text-center mb-4">
      <div class="display-5 text-success fw-bold">⌨️</div>
      <p class="fs-3 text-dark mb-1">{% trans %}Druk op de <strong>5</strong>{% endtrans %}</p>
      <p class="text-muted mb-0">{{ _('Gebruik de cijfertoetsen bovenaan het toetsenbord') }}</p>
    </div>

    <div class="keyboard-layout">
      
      <!-- Main keyboard -->
      <div class="main-keyboard">
        <div class="keyboard-row highlighted-row">
          <button type="button" class="btn btn-jungle btn-lg key-btn key-top" data-key="1">1</button>
          <button type="button" class="btn btn-jungle btn-lg key-btn key-top" data-key="2">2</button>
          <button type="button" class="btn btn-jungle btn-lg key-btn key-top" data-key="3">3</button>
          <button type="button" class="btn btn-jungle btn-lg key-btn key-top" data-key="4">4</button>
          <button type="button" class="btn btn-jungle btn-lg key-btn key-top key-target" data-key="5">5</button>
          <button type="button" class="btn btn-jungle btn-lg key-btn key-top" data-key="6">6</button>
          <button type="button" class="btn btn-jungle btn-lg key-btn key-top" data-key="7">7</button>
          <button type="button" class="btn btn-jungle btn-lg key-btn key-top" data-key="8">8</button>
          <button type="button" class="btn btn-jungle btn-lg key-btn key-top" data-key="9">9</button>
          <button type="button" class="btn btn-jungle btn-lg key-btn key-top" data-key="0">0</button>
        </div>

        <div class="keyboard-row dim-row">
          <div class="fake-key">A</div>
          <div class="fake-key">Z</div>
          <div class="fake-key">E</div>
          <div class="fake-key">R</div>
          <div class="fake-key">T</div>
          <div class="fake-key">Y</div>
          <div class="fake-key">U</div>
          <div class="fake-key">I</div>
          <div class="fake-key">O</div>
          <div class="fake-key">P</div>
        </div>

        <div class="keyboard-row dim-row offset-row">
          <div class="fake-key">Q</div>
          <div class="fake-key">S</div>
          <div class="fake-key">D</div>
          <div class="fake-key">F</div>
          <div class="fake-key">G</div>
          <div class="fake-key">H</div>
          <div class="fake-key">J</div>
          <div class="fake-key">K</div>
          <div class="fake-key">L</div>
          <div class="fake-key">M</div>
        </div>

        <div class="keyboard-row dim-row bigger-offset-row">
          <div class="fake-key">W</div>
          <div class="fake-key">X</div>
          <div class="fake-key">C</div>
          <div class="fake-key">V</div>
          <div class="fake-key">B</div>
          <div class="fake-key">N</div>
          
        </div>

        <div class="keyboard-row">
          <div class="fake-spacebar">{{ _('spatie') }}</div>
        </div>
      </div>

      <!-- Numpad -->
      <div class="numpad-block">
        <div class="numpad-title text-center mb-2">{{ _('Niet deze toetsen') }}</div>
        <div class="numpad-grid">
          <button type="button" class="btn btn-lg key-btn key-numpad key-numpad-wrong-style" data-key="7">7</button>
          <button type="button" class="btn btn-lg key-btn key-numpad key-numpad-wrong-style" data-key="8">8</button>
          <button type="button" class="btn btn-lg key-btn key-numpad key-numpad-wrong-style" data-key="9">9</button>

          <button type="button" class="btn btn-lg key-btn key-numpad key-numpad-wrong-style" data-key="4">4</button>
          <button type="button" class="btn btn-lg key-btn key-numpad key-numpad-wrong-style" data-key="5">5</button>
          <button type="button" class="btn btn-lg key-btn key-numpad key-numpad-wrong-style" data-key="6">6</button>

          <button type="button" class="btn btn-lg key-btn key-numpad key-numpad-wrong-style" data-key="1">1</button>
          <button type="button" class="btn btn-lg key-btn key-numpad key-numpad-wrong-style" data-key="2">2</button>
          <button type="button" class="btn btn-lg key-btn key-numpad key-numpad-wrong-style" data-key="3">3</button>

          <div></div>
          <button type="button" class="btn btn-lg key-btn key-numpad key-numpad-wrong-style" data-key="0">0</button>
          <div></div>
        </div>
      </div>

    </div>
  </div>
</div>

<style>

  .demo-locked {
  cursor: default;
}
  .keyboard-demo-wrapper {
    max-width: 1200px;
    width: 100%;
  }

  .keyboard-layout {
    display: flex;
    gap: 36px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
  }

  .main-keyboard {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .keyboard-row {
    display: flex;
    gap: 10px;
    justify-content: flex-start;
  }

  .highlighted-row {
    background: rgba(25, 135, 84, 0.10);
    border: 3px solid rgba(25, 135, 84, 0.30);
    border-radius: 18px;
    padding: 14px;
  }

  .dim-row {
    opacity: 0.55;
  }

  .offset-row {
    margin-left: 18px;
  }

  .bigger-offset-row {
    margin-left: 42px;
  }

  .fake-key,
  .fake-spacebar {
    width: 62px;
    height: 62px;
    background: #e9ecef;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #6c757d;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08);
    user-select: none;
  }

  .fake-spacebar {
    width: 420px;
    max-width: 100%;
  }

  .numpad-block {
    background: rgba(0,0,0,0.03);
    border-radius: 18px;
    padding: 14px;
  }

  .numpad-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #6c757d;
  }

  .numpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 62px);
    gap: 10px;
    justify-content: center;
  }

  .key-btn {
    width: 62px;
    height: 62px;
    padding: 0;
  }

  .key-numpad-wrong-style {
  background: #f7c8c8;
  color: #8b2e2e;
  border: 2px solid #e6a4a4;
  box-shadow: 0px 6px 0 #c97f7f;
}

.key-numpad-wrong-style:hover,
.key-numpad-wrong-style:focus,
.key-numpad-wrong-style:focus-visible {
  background: #efb5b5 !important;
  color: #7a2525 !important;
  border-color: #db8f8f !important;
  box-shadow: 0px 6px 0 #b96d6d !important;
  outline: none !important;
}

.key-numpad-wrong-style:active {
  background: #efb5b5 !important;
  color: #7a2525 !important;
  box-shadow: 0px 2px 0 #b96d6d !important;
  transform: translateY(2px);
}

.key-numpad-wrong-style,
.key-numpad-wrong-style:disabled {
  background: #f7c8c8 !important;
  color: #8b2e2e !important;
  border: 2px solid #e6a4a4 !important;
  box-shadow: 0px 6px 0 #c97f7f !important;
  opacity: 1 !important;
}

.key-numpad-wrong-style:disabled:active {
  transform: none;
  box-shadow: 0px 6px 0 #c97f7f !important;
}

  .btn-jungle:focus,
  .btn-jungle:focus-visible {
    outline: none !important;
    box-shadow: 0px 6px 0 #1c5c39;
  }

  .btn-jungle:active {
    outline: none !important;
  }

  .keyboard-selected {
    transform: translateY(2px);
    box-shadow: 0px 2px 0 #1c5c39 !important;
  }

  .key-target {
    position: relative;
  }

  .key-target::after {
    content: "";
    position: absolute;
    inset: -8px;
    border: 3px dashed rgba(25, 135, 84, 0.5);
    border-radius: 16px;
    pointer-events: none;
  }

  @media (max-width: 768px) {
    .keyboard-layout {
      gap: 24px;
    }

    .keyboard-row {
      gap: 6px;
    }

    .highlighted-row {
      padding: 10px;
    }

    .fake-key,
    .key-btn {
      width: 48px;
      height: 48px;
      font-size: 1rem;
    }

    .numpad-grid {
      grid-template-columns: repeat(3, 48px);
      gap: 6px;
    }

    .fake-spacebar {
      width: 320px;
    }
  }
</style>

<script>
  window.__demoDisableAudioAutoNext = true;
  window.__demoAudioDone = false;

  const listenIndicator = document.getElementById("listen-indicator");

  function showListenIndicator() {
    if (listenIndicator) listenIndicator.classList.remove("d-none");
  }

  function hideListenIndicator() {
    if (listenIndicator) listenIndicator.classList.add("d-none");
  }

  function attachListenIndicator(audioEl) {
    if (!audioEl) return;
    audioEl.addEventListener("play", showListenIndicator);
    audioEl.addEventListener("playing", showListenIndicator);
    audioEl.addEventListener("pause", hideListenIndicator);
    audioEl.addEventListener("ended", hideListenIndicator);
  }

  attachListenIndicator(document.getElementById("audio-toprow-wrong"));
  attachListenIndicator(document.getElementById("audio-numpad-wrong"));
  attachListenIndicator(document.getElementById("audio-correct"));

  function stopAndReset(audioEl) {
    if (!audioEl) return;
    try { audioEl.pause(); } catch (e) {}
    try { audioEl.currentTime = 0; } catch (e) {}
  }

  function stopAllDemoAudio() {
    stopAndReset(document.getElementById("demo-audio"));
    stopAndReset(document.getElementById("audio-toprow-wrong"));
    stopAndReset(document.getElementById("audio-numpad-wrong"));
    stopAndReset(document.getElementById("audio-correct"));
    hideListenIndicator();
  }

  function flashKeyboardSelected(btnEl) {
    if (!btnEl) return;
    btnEl.classList.add("keyboard-selected");
    setTimeout(() => btnEl.classList.remove("keyboard-selected"), 180);
  }

  function getAllKeyButtons() {
    return document.querySelectorAll(".key-btn");
  }

  function setButtonsEnabled(enabled) {
  getAllKeyButtons().forEach(btn => {
    btn.classList.toggle("demo-locked", !enabled);
  });
}

  let mainAudioFinished = false;
  let pageLocked = true;
  let successPlayed = false;

  function lockPage() {
    pageLocked = true;
    setButtonsEnabled(false);
  }

  function unlockPage() {
    pageLocked = false;
    setButtonsEnabled(true);
  }

  function canInteract() {
    return mainAudioFinished && !pageLocked && !successPlayed;
  }

  function setResultFields(result, key, source) {
    document.getElementById("numpad-result").value = result;
    document.getElementById("numpad-key").value = key;
    document.getElementById("numpad-source").value = source;
  }

  function playScenarioAudio(audioId, onEnd) {
    lockPage();
    stopAllDemoAudio();

    const audio = document.getElementById(audioId);
    if (!audio) return;

    audio.onended = null;
    audio.onended = () => {
      hideListenIndicator();
      if (typeof onEnd === "function") onEnd();
    };

    audio.play().catch(() => {
      hideListenIndicator();
      if (typeof onEnd === "function") onEnd();
    });
  }

  function handleTopRowKey(key) {
    if (!canInteract()) return;

    if (String(key) === "5") {
      successPlayed = true;
      setResultFields("C", key, "toprow");

      playScenarioAudio("audio-correct", () => {
        const form = document.getElementById("demo-next-form");
        if (form) form.submit();
      });
    } else {
      setResultFields("B", key, "toprow");

      playScenarioAudio("audio-toprow-wrong", () => {
        unlockPage();
      });
    }
  }

  function handleNumpadKey(key) {
    if (!canInteract()) return;

    setResultFields("A", key, "numpad");

    playScenarioAudio("audio-numpad-wrong", () => {
      unlockPage();
    });
  }

  function handleInput(source, key, btnEl = null) {
    if (btnEl) flashKeyboardSelected(btnEl);

    if (source === "toprow") {
      handleTopRowKey(key);
      return;
    }

    if (source === "numpad") {
      handleNumpadKey(key);
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    lockPage();

    document.querySelectorAll(".key-top").forEach(btn => {
      btn.addEventListener("click", () => {
        handleInput("toprow", btn.dataset.key, btn);
      });
    });

    document.querySelectorAll(".key-numpad").forEach(btn => {
      btn.addEventListener("click", () => {
        handleInput("numpad", btn.dataset.key, btn);
      });
    });

    const checkDone = () => {
      if (window.__demoAudioDone === true) {
        mainAudioFinished = true;
        unlockPage();
      }
    };

    checkDone();

    const poll = setInterval(() => {
      if (window.__demoAudioDone === true) {
        clearInterval(poll);
        mainAudioFinished = true;
        unlockPage();
      }
    }, 200);
  });

  document.addEventListener("keydown", (e) => {
    const key = e.key;
    if (!/^[0-9]$/.test(key)) return;

    e.preventDefault();

    if (e.code && e.code.startsWith("Digit")) {
      const btn = document.querySelector('.key-top[data-key="' + key + '"]');
      handleInput("toprow", key, btn);
      return;
    }

    if (e.code && e.code.startsWith("Numpad")) {
      const btn = document.querySelector('.key-numpad[data-key="' + key + '"]');
      handleInput("numpad", key, btn);
    }
  });
</script>


{% endblock %}
