{% extends "base.html" %}

{% block content %}




<h1 class="display-4 text-success mb-3 fw-bold">Leerkracht Login</h1>

<form method="post" class="w-50">
  <div class="mb-3">
    <label for="username" class="form-label fw-bold fs-5">Gebruikersnaam</label>
    <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Voer je gebruikersnaam in" required>
  </div>

  <div class="mb-3 position-relative">
    <label for="password" class="form-label fw-bold fs-5">Wachtwoord</label>
    <div class="input-group">
      <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Voer je wachtwoord in" required>
      <button type="button" class="btn btn-secondary" id="togglePassword">
        <i class="bi bi-eye"></i>
      </button>
    </div>
  </div>

  <button type="submit" class="btn btn-success btn-lg w-100">Login</button>
</form>

<!-- NEW Register button -->
<a href="{{ url_for('auth.register_teacher') }}" class="btn btn-success btn-lg mt-3 w-50">Nog geen account? Registreer!</a>

<a href="{{ url_for('auth.index') }}" class="btn btn-outline-success btn-lg mt-3">← Terug naar start</a>

<a href="/static/handleiding_leerkracht.html" target="_blank" class="btn btn-secondary btn-lg mt-3">
  📖 Handleiding openen
</a>

<script>
  const togglePassword = document.querySelector("#togglePassword");
  const password = document.querySelector("#password");
  const icon = togglePassword.querySelector("i");

  togglePassword.addEventListener("click", function () {
    const type = password.getAttribute("type") === "password" ? "text" : "password";
    password.setAttribute("type", type);
    icon.classList.toggle("bi-eye");
    icon.classList.toggle("bi-eye-slash");
  });
</script>
{% endblock %}
